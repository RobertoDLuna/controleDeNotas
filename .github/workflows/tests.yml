name: Executar Testes Automatizados - controleDeNotas

# Roda os testes sempre que houver push ou Pull Request na branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-junit:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa os arquivos do repositório controleDeNotas
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configura o Java 11 no servidor do GitHub
      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Roda toda a suíte de testes automatizados
      - name: Executar testes com Maven
        run: mvn test
